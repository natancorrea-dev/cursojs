    <title>Lampadas</title>

<body>
    <h1>Imagens</h1>

    <img src="lamp_desl.png" alt="Lâmpada" id="lampada" onclick="alternar()">

    <script>  
    
        let ligada = false

        function alternar(){
            const lampada = document.getElementById("lampada")

            if (ligada){
                lampada.src = "lamp_desl.png"
            } else{
                lampada.src = "lamp_lig.png"
            }

            ligada = !ligada
        }
